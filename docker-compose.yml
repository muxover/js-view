services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # HTTP API: validates requests and dispatches renders to the queue.
  api:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      JSVIEW_ROLE: api
      PORT: 8080
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: jsview-render
    volumes:
      - sessions:/app/sessions

  # Worker: consumes the queue and runs the headless browser renders.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      JSVIEW_ROLE: worker
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: jsview-render
      QUEUE_CONCURRENCY: 2
      BROWSER_POOL_SIZE: 2
    volumes:
      - sessions:/app/sessions
    # Scale workers horizontally: docker compose up --scale worker=4
    shm_size: "1gb"

volumes:
  sessions:
