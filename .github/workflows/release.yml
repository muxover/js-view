name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@muxover/js-view@$version" version >/dev/null 2>&1; then
            echo "@muxover/js-view@$version is already on npm"
          else
            npm ci
            npm publish --provenance --access public
          fi

      - name: Resolve release notes
        id: notes
        run: |
          file="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
            echo "name=$(head -n 1 "$file" | sed -E 's/^# [^ ]+ //')" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
